server:
  port: 8080

spring:
  application:
    name: fred-invest-agent

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fredinvestdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"


app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLXJhbmRvbS-zZWNyZXQta2V5LWZvci1mcmVkLWludmVzdC1hcHAtMjAyNC1zZWN1cmUtand0LXRva2Vu}
    expiration-ms: 86400000 # 24 Hours
  ai:
    api-key: ${AI_PROVIDER_API_KEY:mock-key}
    api-url: ${AI_PROVIDER_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}
  open-finance:
    xp:
      client-id: ${XP_OPENFINANCE_CLIENT_ID:}
      client-secret: ${XP_OPENFINANCE_CLIENT_SECRET:}
      auth-url: ${XP_OPENFINANCE_AUTH_URL:https://developers.xpi.com.br}
      token-url: ${XP_OPENFINANCE_TOKEN_URL:https://openapi.xpi.com.br/oauth2/v1/access-token}
      api-url: ${XP_OPENFINANCE_API_URL:https://openapi.xpi.com.br/open-banking}
      redirect-uri: ${XP_OPENFINANCE_REDIRECT_URI:http://localhost:8080/open-finance-callback.html}
    pluggy:
      client-id: ${PLUGGY_CLIENT_ID:}
      client-secret: ${PLUGGY_CLIENT_SECRET:}
      api-url: ${PLUGGY_API_URL:https://api.pluggy.ai}

