<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Finance Brasil - Autorização XP</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary, #0B0E14);
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--bg-secondary, #151922);
      border: 1px solid rgba(245, 166, 35, 0.4);
      border-radius: 0.75rem;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .spinner {
      border: 3px solid rgba(245, 166, 35, 0.2);
      border-top: 3px solid #F5A623;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 0.9s linear infinite;
      margin: 1.5rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      background: #F5A623;
      color: #000;
      font-weight: bold;
      border-radius: 0.375rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="background: #000; color: #F5A623; font-weight: 900; font-size: 1.5rem; width: 50px; height: 50px; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; border: 1px solid #F5A623;">
      XP
    </div>
    <h2 style="margin: 0 0 0.5rem; font-size: 1.35rem;">Open Finance Brasil</h2>
    <p style="font-size: 0.85rem; color: #94A3B8; margin-bottom: 1rem;">Processando autorização oficial de investimentos da XP...</p>

    <div id="loading-box">
      <div class="spinner"></div>
      <p id="status-text" style="font-size: 0.9rem; color: #E2E8F0;">Validando consentimento e sincronizando ativos de custódia oficial...</p>
    </div>

    <div id="result-box" style="display: none;">
      <div id="result-icon" style="font-size: 2.5rem; margin-bottom: 0.5rem;"></div>
      <p id="result-msg" style="font-size: 0.95rem; line-height: 1.5;"></p>
      <button class="btn" onclick="window.location.href='/'">Voltar ao Painel</button>
    </div>
  </div>

  <script>
    async function processCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDesc = params.get('error_description');

      const token = localStorage.getItem('jwt_token') || sessionStorage.getItem('jwt_token');

      const loadingBox = document.getElementById('loading-box');
      const resultBox = document.getElementById('result-box');
      const resultIcon = document.getElementById('result-icon');
      const resultMsg = document.getElementById('result-msg');

      if (error) {
        loadingBox.style.display = 'none';
        resultBox.style.display = 'block';
        resultIcon.innerText = '❌';
        resultMsg.innerText = 'Autorização rejeitada ou cancelada: ' + (errorDesc || error);
        resultMsg.style.color = '#EF4444';
        return;
      }

      if (!code) {
        loadingBox.style.display = 'none';
        resultBox.style.display = 'block';
        resultIcon.innerText = '⚠️';
        resultMsg.innerText = 'Nenhum código de autorização foi recebido da XP.';
        resultMsg.style.color = '#F5A623';
        return;
      }

      try {
        const res = await fetch('/api/v1/open-finance/xp/callback', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            code: code,
            state: state,
            replacePortfolio: true
          })
        });

        const data = await res.json();
        loadingBox.style.display = 'none';
        resultBox.style.display = 'block';

        if (res.ok) {
          resultIcon.innerText = '✅';
          resultMsg.innerText = data.message || 'Conexão autorizada com sucesso! Seus ativos oficiais da XP foram sincronizados.';
          resultMsg.style.color = '#10B981';
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          resultIcon.innerText = '❌';
          resultMsg.innerText = 'Erro ao sincronizar com a XP: ' + (data.message || 'Falha de comunicação');
          resultMsg.style.color = '#EF4444';
        }
      } catch (err) {
        loadingBox.style.display = 'none';
        resultBox.style.display = 'block';
        resultIcon.innerText = '❌';
        resultMsg.innerText = 'Erro de conexão: ' + err.message;
        resultMsg.style.color = '#EF4444';
      }
    }

    window.addEventListener('DOMContentLoaded', processCallback);
  </script>
</body>
</html>
