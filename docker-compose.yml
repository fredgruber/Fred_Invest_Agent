services:
  db:
    image: postgres:16-alpine
    container_name: fred_invest_db
    environment:
      POSTGRES_DB: fredinvest
      POSTGRES_USER: freduser
      POSTGRES_PASSWORD: fredpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freduser -d fredinvest"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fred_invest_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fredinvest
      SPRING_DATASOURCE_USERNAME: freduser
      SPRING_DATASOURCE_PASSWORD: fredpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: c2VjdXJlLXJhbmRvbS-zZWNyZXQta2V5LWZvci1mcmVkLWludmVzdC1hcHAtMjAyNC1zZWN1cmUtand0LXRva2Vu
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-mock_key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-mock_google_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-mock_google_client_secret}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-mock_apple_client_id}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-mock_apple_client_secret}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-mock_microsoft_client_id}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-mock_microsoft_client_secret}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:

