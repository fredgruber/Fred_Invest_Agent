server:
  port: 8080

spring:
  application:
    name: fred-invest-agent

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:fredinvest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-demo}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-demo}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          apple:
            client-id: ${APPLE_CLIENT_ID:apple-client-id-demo}
            client-secret: ${APPLE_CLIENT_SECRET:apple-client-secret-demo}
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID:microsoft-client-id-demo}
            client-secret: ${MICROSOFT_CLIENT_SECRET:microsoft-client-secret-demo}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/v1.0/me
            user-name-attribute: displayName

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLXJhbmRvbS-zZWNyZXQta2V5LWZvci1mcmVkLWludmVzdC1hcHAtMjAyNC1zZWN1cmUtand0LXRva2Vu}
    expiration-ms: 86400000 # 24 Hours
  ai:
    api-key: ${AI_PROVIDER_API_KEY:mock-key}
    api-url: ${AI_PROVIDER_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${AI_MODEL:gpt-4o-mini}

